[package]
name = "cuvs-sys"
description = "Raw FFI bindings to libcuvs_c — NVIDIA cuVS GPU-accelerated vector search"
links = "cuvs_c"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
generate-bindings = ["bindgen"]
doc-only = []

[build-dependencies]
bindgen = { version = "0.72", optional = true }
cmake-package = "0.1"
thiserror = "2.0.18"

[package.metadata.docs.rs]
# docs.rs builds have no CUDA or libcuvs. The doc-only feature skips native
# library discovery, using pre-generated bindings instead.
features = ["doc-only"]
